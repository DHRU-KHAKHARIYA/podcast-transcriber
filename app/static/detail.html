<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast Transcriber — Detail</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">🎙 Podcast Transcriber</span>
    <div class="navbar-right">
      <span id="nav-username"></span>
      <button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="detail-header">
      <button class="btn btn-ghost btn-sm" onclick="history.back()">← Back</button>
      <h1 id="detail-filename" style="font-size:1.1rem; font-weight:600;"></h1>
    </div>

    <div class="audio-card">
      <div class="audio-load" id="audio-load">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 18V6l12-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Load your audio file to listen along</span>
        <label class="btn btn-ghost btn-sm" for="audio-file-input">Browse file</label>
        <input type="file" id="audio-file-input" accept="audio/*" style="display:none" />
      </div>
      <div id="audio-player-wrap" class="hidden">
        <audio id="audio-player" controls></audio>
        <button class="audio-remove-btn" id="audio-remove-btn" title="Remove audio">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Change file
        </button>
      </div>
    </div>

    <div id="speakers-panel"></div>

    <div class="transcript-toolbar">
      <div class="section-title">Transcript</div>
      <div class="transcript-actions">
        <button class="btn btn-ghost btn-sm" id="search-toggle">Search</button>
        <button class="btn btn-ghost btn-sm" id="autoscroll-btn" title="Toggle auto-scroll">Auto-scroll: Off</button>
        <button class="btn btn-ghost btn-sm" id="copy-btn">Copy</button>
        <button class="btn btn-ghost btn-sm" id="save-btn">Save edits</button>
        <div class="export-wrap">
          <button class="btn btn-ghost btn-sm" id="export-btn">Export ▾</button>
          <div class="export-menu hidden" id="export-menu">
            <button id="export-txt">Plain text (.txt)</button>
            <button id="export-srt">Subtitles (.srt)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-bar hidden" id="search-bar">
      <input type="text" id="search-input" placeholder="Search transcript…" />
      <span class="search-count" id="search-count"></span>
      <span style="font-size:0.75rem;color:var(--text-muted)">Enter ↓ · Shift+Enter ↑</span>
      <button class="search-close" id="search-close">✕</button>
    </div>

    <div class="transcript" id="transcript"></div>

    <div class="detail-meta" id="detail-meta"></div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
  <script src="/static/app.js"></script>
</body>
</html>
