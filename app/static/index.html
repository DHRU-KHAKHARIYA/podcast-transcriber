<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast Transcriber — Sign In</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card card">
      <div class="auth-logo">🎙 Podcast Transcriber</div>
      <p class="auth-subtitle">Transcribe and diarize your audio files</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <!-- Login -->
      <div id="tab-login" class="tab-panel active">
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="login-btn" style="width:100%">Sign In</button>
        <div id="login-error" class="alert alert-error hidden"></div>
      </div>

      <!-- Register -->
      <div id="tab-register" class="tab-panel">
        <div class="field">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" id="register-btn" style="width:100%">Create Account</button>
        <div id="register-msg" class="alert hidden"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
