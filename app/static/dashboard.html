<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast Transcriber — Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">🎙 Podcast Transcriber</span>
    <div class="navbar-right">
      <span id="nav-username"></span>
      <button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
    </div>
  </nav>

  <div class="main-content">
    <!-- Upload -->
    <div class="upload-panel card">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">📂</div>
        <div class="drop-zone-label">
          Drop an audio file here, or <span id="browse-link">browse</span>
        </div>
        <input type="file" id="file-input" accept="audio/*" />
      </div>
      <div id="selected-filename"></div>

      <div class="upload-meta">
        <div class="field">
          <label for="speaker-count">Number of speakers</label>
          <input type="number" id="speaker-count" value="2" min="1" max="10" />
        </div>
        <button class="btn btn-primary" id="transcribe-btn" disabled>
          <span id="transcribe-label">Transcribe</span>
          <span id="transcribe-spinner" class="spinner hidden"></span>
        </button>
      </div>

      <div id="upload-error" class="alert alert-error hidden"></div>
      <div id="upload-success" class="alert alert-success hidden"></div>
    </div>

    <!-- History -->
    <div class="card">
      <div class="section-title">Your Transcriptions</div>
      <div class="table-wrap">
        <table id="transcriptions-table">
          <thead>
            <tr>
              <th>Filename</th>
              <th>Speakers</th>
              <th>Duration</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="transcriptions-body">
            <tr><td colspan="5" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
